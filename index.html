<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>唐诗 GPT</title>
  </head>
  <body>
    <header>
      <h1>唐诗 GPT</h1>
      <p>不装 Python、不要显卡驱动、不要 API key，打开网页，看一个 GPT 在你的浏览器里从零学会写五言绝句。</p>
      <dl class="meta">
        <div><dt>后端</dt><dd class="badge" data-testid="backend">—</dd></div>
        <div><dt>参数量</dt><dd data-testid="params">—</dd></div>
        <div><dt>随机基线 ln(V)</dt><dd data-testid="loss-baseline">—</dd></div>
      </dl>
      <p class="notice" data-testid="backend-notice" hidden></p>
      <p data-testid="dataset-info">数据集：加载中…</p>
    </header>
    <main>
      <section class="controls">
        <button type="button" data-testid="start-toggle" disabled>正在准备…</button>
        <label>
          温度
          <input type="range" data-testid="temperature" min="0.1" max="1.5" step="0.1" value="0.8" aria-label="温度" />
          <output data-testid="temperature-value">0.8</output>
        </label>
        <label><input type="checkbox" data-testid="constrain" checked /> 强制五绝格式</label>
        <button type="button" data-testid="generate" disabled>立即生成</button>
        <button type="button" data-testid="save" disabled>保存</button>
        <button type="button" data-testid="load" disabled>载入</button>
        <button type="button" data-testid="ignore-save" hidden>忽略</button>
        <button type="button" data-testid="delete-save" disabled>删除存档</button>
      </section>
      <p class="save-status" data-testid="save-status" role="status"></p>
      <section>
        <dl class="meta">
          <div><dt>步数</dt><dd data-testid="step">0</dd></div>
          <div><dt>初始 loss</dt><dd data-testid="loss-initial">—</dd></div>
          <div><dt>当前 loss</dt><dd data-testid="loss-current">—</dd></div>
          <div><dt>验证 loss</dt><dd data-testid="loss-val">—</dd></div>
          <div><dt>步/秒</dt><dd data-testid="speed">0.0</dd></div>
          <div><dt>已训练</dt><dd data-testid="elapsed">00:00</dd></div>
        </dl>
        <div class="chart">
          <canvas data-testid="loss-chart" role="img" aria-label="训练 loss 曲线"></canvas>
          <p class="empty" data-testid="loss-empty">点击「开始训练」后这里会画出 loss 曲线</p>
        </div>
        <p class="legend">细线：每步训练 loss · 粗线：平滑后（EMA）· 朱砂圆点：验证 loss</p>
      </section>
      <section>
        <h2>生成记录</h2>
        <div data-testid="samples"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
